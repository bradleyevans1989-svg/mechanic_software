# One-click deploy on Render (render.com). Starter plan + 1 GB disk is about US$7.25/month.
services:
  - type: web
    name: workshop
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Australia/Sydney
      - key: DB_PATH
        value: /var/data/workshop.db
      - key: SETUP_CODE        # you type this once, on first visit, to create the owner login
        sync: false
      - key: APP_URL           # e.g. https://workshop-xxxx.onrender.com (used for the Xero redirect)
        sync: false
      - key: XERO_CLIENT_ID    # from developer.xero.com; leave blank until you connect Xero
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
