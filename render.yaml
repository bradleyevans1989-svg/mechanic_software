# Deploy on Render (render.com) as a Blueprint.
# Starter web service (US$7/month) + Basic Postgres (about US$6/month), Singapore region.
databases:
  - name: workshop-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: workshop
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workshop-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL           # e.g. https://workshop-xxxx.onrender.com (used for the Xero redirect)
        sync: false
      - key: SIGNUP_CODE       # optional: only people with this code can sign up a workshop
        sync: false
      - key: STRIPE_SECRET_KEY # from dashboard.stripe.com; leave blank to run without billing
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLAN_PRICE_LABEL
        value: "$49/month"
      - key: XERO_CLIENT_ID    # from developer.xero.com; leave blank until you connect Xero
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
